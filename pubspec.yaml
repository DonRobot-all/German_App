name: german_words
description: Приложение для изучения и повторения немецких слов.
publish_to: 'none'
version: 0.10.1+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.2.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  file_picker: ^8.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
