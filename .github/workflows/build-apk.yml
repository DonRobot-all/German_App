name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name german_words _tmp_project
            cp -r _tmp_project/android ./android
            rm -rf _tmp_project
          fi

      - name: Patch Android project
        run: python3 tools/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: german-words-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
