name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Права нужны, чтобы выложить APK в раздел Releases (оттуда его берёт приложение).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Пароль от ключа подписи берётся из секретов репозитория (в коде его нет).
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android-часть проекта не хранится в репозитории: создаём её, если папки нет.
      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name german_words _tmp_project
            cp -r _tmp_project/android ./android
            rm -rf _tmp_project
          fi

      # Ключ подписи хранится в секретах GitHub, а не в репозитории.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
            echo "Ключ подписи восстановлен"
          else
            echo "Секрет KEYSTORE_BASE64 не задан: сборка будет с debug-ключом"
          fi

      # Разрешения, получатели уведомлений, озвучка и desugaring для плагинов.
      - name: Patch Android project
        run: python3 tools/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (не блокирует сборку)
        run: flutter analyze
        continue-on-error: true

      # --no-shrink: без сжатия кода R8, иначе в релизе могут не сработать уведомления.
      - name: Build APK
      # Номер сборки = номер запуска: он растёт с каждым запуском, поэтому Android
      # принимает новую версию как обновление, а приложение понимает, что вышла новая.
        run: >
          flutter build apk --release --no-shrink
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: german-words-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Публикуем релиз: приложение на телефоне проверяет его и предлагает обновиться.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk german-words.apk
          gh release create "build-${{ github.run_number }}" german-words.apk \
            --title "Сборка ${{ github.run_number }}" \
            --notes "Автоматическая сборка из коммита ${{ github.sha }}"
